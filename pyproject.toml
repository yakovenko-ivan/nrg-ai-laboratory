[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrg-ai-laboratory"
dynamic = ["version"]
description = "Portable agentic laboratory infrastructure and reusable analysis tools for the external NRG CFD package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
"NRG upstream" = "https://github.com/yakovenko-ivan/NRG"

[project.optional-dependencies]
dev = ["pytest>=8"]

# OPTIONAL independent reference for NRG validation only.  Cantera is NOT a
# laboratory dependency: it is not required for the generic laboratory, agent
# registration, routine campaigns, the NRG build, or native NRG diagnostics.
# Install deliberately with:  pip install -e '.[cantera]'
cantera = ["cantera==3.2.0"]

visualization = [
    "numpy>=2.5,<3",
    "matplotlib>=3.11,<4",
]

[project.scripts]
nrg-lab = "agent_workspace.lab_bridge:main"
nrg-lab-config = "nrg_analysis.config_cli:main"
nrg-lab-doctor = "nrg_analysis.doctor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nrg_analysis*", "agent_workspace*", "campaign_tools*"]
namespaces = false

[tool.setuptools.package-data]
agent_workspace = [
  "workspace_policy.json",
  "studies/_template/STUDY.md",
  "studies/_template/analysis_config.toml",
  "studies/_template/analyze.py",
]

[tool.setuptools.dynamic]
version = {attr = "nrg_analysis._version.__version__"}

[tool.pytest.ini_options]
# Positive collection boundary: ordinary repository pytest discovery must use
# the permanent tracked test suite under tests/.  Ignored/local research studies
# under agent_workspace/studies/ may legitimately contain historical Python files
# named test_*.py (e.g. one-time bootstrap verification copies), but they are not
# part of the permanent repository test suite and must not be collected by
# default.
testpaths = ["tests"]
